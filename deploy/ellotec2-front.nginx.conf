# Front Angular do ELLOTEC ERP servido pelo nginx na porta 8504.
#
# Instalação (uma vez, como root):
#   sudo cp deploy/ellotec2-front.nginx.conf /etc/nginx/sites-available/ellotec2
#   sudo ln -s /etc/nginx/sites-available/ellotec2 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# O deploy só copia os arquivos para /home/ello/projetos/ellotec2/front — não precisa
# reiniciar o nginx a cada publicação.

server {
    listen 8504;
    listen [::]:8504;
    server_name 192.168.20.12 srv-automacao;

    # A pasta fica dentro da home do usuário ello. O nginx roda como www-data,
    # então precisa poder ATRAVESSAR a home para chegar até aqui (uma vez):
    #   sudo chmod o+x /home/ello /home/ello/projetos /home/ello/projetos/ellotec2
    root /home/ello/projetos/ellotec2/front;
    index index.html;

    # SPA: qualquer rota do Angular (/pedidos, /expedicao/...) não existe como
    # arquivo no disco. Sem este fallback, dar F5 dentro do sistema devolve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os arquivos do build vêm com hash no nome (outputHashing: all), então
    # podem ser cacheados para sempre. O index.html não — é ele que aponta
    # para os hashes novos a cada deploy.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
